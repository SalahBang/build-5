name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from Bot'
        required: true
      userId:
        description: 'User ID'
        required: true
      payload:
        description: 'Build Payload (JSON)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          URL=$(echo '${{ github.event.inputs.payload }}' | jq -r '.zipAssetUrl')
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/octet-stream" -o project.zip "$URL"
          mkdir -p project
          unzip -qq project.zip -d project
          PUBSPEC=$(find project -maxdepth 8 -iname "pubspec.yaml" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml tidak ditemukan di dalam ZIP"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$PUBSPEC")
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

      - name: Clean Stale Build Cache
        run: |
          cd "${{ env.PROJECT_ROOT }}"
          rm -rf build .dart_tool android/.gradle android/build android/app/build ios/Pods ios/.symlinks
          find . -iname "local.properties" -delete

      - name: Fix Android SDK Path
        run: echo "sdk.dir=$ANDROID_HOME" > "${{ env.PROJECT_ROOT }}/android/local.properties"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK and SDK Platform
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973" "ndk;28.2.13676358" "platforms;android-36" "build-tools;35.0.0" --sdk_root=$ANDROID_HOME 2>&1 | tail -3 || true

      - name: Detect Required Flutter Version
        run: |
          if grep -A3 '^environment:' "${{ env.PROJECT_ROOT }}/pubspec.yaml" | grep -qE '^\s*flutter:\s*[''"]?[0-9]'; then
            echo "HAS_FLUTTER_VERSION=true" >> $GITHUB_ENV
          else
            echo "HAS_FLUTTER_VERSION=false" >> $GITHUB_ENV
          fi

      - name: Setup Flutter (versi sesuai project)
        if: env.HAS_FLUTTER_VERSION == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: ${{ env.PROJECT_ROOT }}/pubspec.yaml
          channel: stable
          cache: true

      - name: Setup Flutter (fallback stable terbaru)
        if: env.HAS_FLUTTER_VERSION == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Build APK Release
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set +e
          BUILD_LOG_FILE=$(mktemp)
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee "$BUILD_LOG_FILE"
          BUILD_EXIT=${PIPESTATUS[0]}

          if [ $BUILD_EXIT -ne 0 ]; then
            REQUIRED_SDK=$(grep -oE "cannot be smaller than version [0-9]+" "$BUILD_LOG_FILE" | grep -oE "[0-9]+" | head -1)

            if [ -n "$REQUIRED_SDK" ]; then
              echo ""
              echo "Terdeteksi butuh minSdk minimal $REQUIRED_SDK, auto-patch build.gradle dan build ulang..."
              python3 - "$REQUIRED_SDK" <<'PYEOF'
          import re, os, sys

          required = sys.argv[1]
          candidates = ["android/app/build.gradle.kts", "android/app/build.gradle"]

          for path in candidates:
              if os.path.exists(path):
                  with open(path) as f:
                      content = f.read()
                  new_content = re.sub(
                      r'(minSdk(?:Version)?\s*=?\s*)(flutter\.minSdkVersion|\d+)',
                      lambda m: m.group(1) + required,
                      content
                  )
                  if new_content != content:
                      with open(path, 'w') as f:
                          f.write(new_content)
                      print(f"Patched {path}: minSdk -> {required}")
                  else:
                      print(f"Tidak menemukan baris minSdk di {path} untuk di-patch")
                  break
          else:
              print("Tidak menemukan file build.gradle/build.gradle.kts")
          PYEOF

              flutter build apk --release --no-tree-shake-icons
              BUILD_EXIT=$?
            fi
          fi

          if [ $BUILD_EXIT -ne 0 ]; then
            INCOMPAT_ERROR=$(grep -cE "can't be (extended|implemented|mixed in) outside of its library|Error: The (method|getter|setter|class|argument) .* (isn't defined|can't be)" "$BUILD_LOG_FILE" || true)

            if [ "$INCOMPAT_ERROR" -gt 0 ]; then
              echo ""
              echo "Terdeteksi kemungkinan incompatibility versi package dengan Flutter SDK, mencoba flutter pub upgrade dan build ulang..."
              flutter pub upgrade
              flutter build apk --release --no-tree-shake-icons
              BUILD_EXIT=$?
            fi
          fi

          exit $BUILD_EXIT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
